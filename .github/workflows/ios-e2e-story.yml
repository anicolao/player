name: iOS E2E story

on:
  workflow_call:
    inputs:
      story:
        description: Canonical E2E story to run on this fresh host
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  story:
    name: E2E story ${{ inputs.story }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-shared-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ios/DerivedData/NormalCI/SharedBuildArtifact
      - name: Verify source and immutable shared build
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          (cd apps/ios/DerivedData/NormalCI/SharedBuildArtifact \
            && shasum -a 256 -c SharedBuild.tar.sha256)
          mkdir -p apps/ios/DerivedData/NormalCI/SharedBuild
          tar -C apps/ios/DerivedData/NormalCI/SharedBuild -xf \
            apps/ios/DerivedData/NormalCI/SharedBuildArtifact/SharedBuild.tar
          portable_tools="${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild/PortableTools"
          export PATH="${portable_tools}:${PATH}"
          printf '%s\n' "${portable_tools}" >> "${GITHUB_PATH}"
          apps/ios/scripts/verify-e2e-environment.sh
          git diff --exit-code -- apps/ios/Player.xcodeproj
          apps/ios/scripts/e2e-build-provenance.sh verify \
            "${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5
      - name: Run one canonical story on this fresh host
        env:
          STORY: ${{ inputs.story }}
        run: |
          mkdir -p "${PWD}/apps/ios/DerivedData/E2E"
          PLAYER_E2E_PARALLEL_WORKERS=1 \
            PLAYER_E2E_BUILD_DATA="${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild" \
            PLAYER_E2E_OUTPUT="${PWD}/apps/ios/DerivedData/E2E/${STORY}" \
            PLAYER_SKIP_E2E_BUILD=1 \
            PLAYER_SKIP_E2E_ENVIRONMENT_VERIFICATION=1 \
            PLAYER_SKIP_PROJECT_GENERATION=1 \
            apps/ios/scripts/run-e2e.sh --story "${STORY}"
      - name: Render reviewable App Store images
        if: inputs.story == '013-app-store-listing'
        run: >-
          swift scripts/render-app-store-listing.swift
          app-store/listing.json
          apps/ios/DerivedData/E2E/013-app-store-listing/ActualWalkthrough/screenshots/ios
          build/app-store-listing/screenshots
      - name: Upload complete story evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-e2e-${{ inputs.story }}
          path: |
            apps/ios/DerivedData/E2E/${{ inputs.story }}/
            build/app-store-listing/screenshots/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
