name: iOS

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_DESIGN.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_DESIGN.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock

permissions:
  contents: read

jobs:
  launch-story:
    name: Build and exact launch walkthrough
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify pinned environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate Xcode project
        run: apps/ios/scripts/generate-project.sh

      - name: Require reproducible project generation
        run: git diff --exit-code -- apps/ios/Player.xcodeproj

      - name: Run semantic and exact-pixel launch story
        run: apps/ios/scripts/run-e2e.sh

      - name: Upload reviewable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-walkthrough
          path: |
            apps/ios/DerivedData/ActualWalkthrough/
            apps/ios/DerivedData/LaunchAttachments/
            apps/ios/DerivedData/Launch.xcresult/
          if-no-files-found: warn
          retention-days: 7
