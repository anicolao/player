name: iOS

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact SHA for the formal R0 qualification gate
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - APP_STORE_LISTING.md
      - APP_STORE_LISTING_DESIGN.md
      - app-store/**
      - scripts/app-store-listing
      - scripts/capture-marketing-screenshots
      - scripts/render-app-store-listing.swift
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - .github/workflows/ios-e2e-story.yml
      - .github/workflows/r0-qualification.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - APP_STORE_LISTING.md
      - APP_STORE_LISTING_DESIGN.md
      - app-store/**
      - scripts/app-store-listing
      - scripts/capture-marketing-screenshots
      - scripts/render-app-store-listing.swift
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - .github/workflows/ios-e2e-story.yml
      - .github/workflows/r0-qualification.yml
      - flake.nix
      - flake.lock

permissions:
  actions: read
  contents: read

jobs:
  e2e-build:
    name: Build the normal-CI E2E product once
    if: inputs.expected_sha == ''
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify source contracts and generate the project
        run: |
          apps/ios/scripts/verify-e2e-environment.sh
          apps/ios/scripts/verify-e2e-hygiene.sh
          apps/ios/scripts/verify-bookshelf-branding.sh
          apps/ios/scripts/verify-storekit-configuration.sh
          apps/ios/scripts/generate-project.sh
          git diff --exit-code -- apps/ios/Player.xcodeproj
      - name: Build and bind the immutable E2E product
        run: |
          build_root="${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild"
          lease="${PWD}/apps/ios/DerivedData/SimulatorLeases/normal-ci-build-$$.json"
          simulator_id=""
          cleanup() {
            status="$?"
            trap - EXIT INT TERM
            if [[ -n "${simulator_id}" ]]; then
              apps/ios/scripts/simulator-lease.sh release "${lease}" "$$" || status=1
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          simulator_id="$(apps/ios/scripts/simulator-lease.sh acquire \
            "${lease}" 'Player normal CI shared build' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5 "$$")"
          xcrun simctl boot "${simulator_id}"
          xcrun simctl bootstatus "${simulator_id}" -b
          xcodebuild build-for-testing \
            -project apps/ios/Player.xcodeproj \
            -scheme Player \
            -configuration E2E \
            -destination "platform=iOS Simulator,arch=arm64,id=${simulator_id}" \
            -derivedDataPath "${build_root}" \
            CODE_SIGNING_ALLOWED=NO
          apps/ios/scripts/prepare-portable-e2e-tools.sh \
            "${build_root}/PortableTools"
          apps/ios/scripts/e2e-build-provenance.sh write "${build_root}" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5
          tar -C "${build_root}" -cf \
            "${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild.tar" \
            Build/Products PlayerE2EBuildProvenance.json PortableTools
          (cd apps/ios/DerivedData/NormalCI \
            && shasum -a 256 SharedBuild.tar > SharedBuild.tar.sha256)
          apps/ios/scripts/simulator-lease.sh release "${lease}" "$$"
          simulator_id=""
      - name: Upload immutable shared E2E product
        uses: actions/upload-artifact@v4
        with:
          name: ios-shared-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/ios/DerivedData/NormalCI/SharedBuild.tar
            apps/ios/DerivedData/NormalCI/SharedBuild.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Five balanced dependency chains match the repository's observed five-runner
  # macOS allowance. Every call still gets a fresh host. `!cancelled()` keeps later
  # work in a chain running after an earlier test failure, so coverage is not
  # shortened on red commits.
  story-005:
    if: inputs.expected_sha == ''
    needs: e2e-build
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 005-play-and-restore

  story-004:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-005]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 004-metadata-repair

  story-009:
    if: inputs.expected_sha == ''
    needs: e2e-build
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 009-accessible-core-journeys

  story-011:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-009]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 011-offline-recovery

  story-007:
    if: inputs.expected_sha == ''
    needs: e2e-build
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 007-sleep-timer

  story-013:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-007]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 013-app-store-listing

  story-003:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-013]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 003-multifile-grouping

  story-008:
    if: inputs.expected_sha == ''
    needs: e2e-build
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 008-library-search

  story-010:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-008]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 010-library-backup

  story-012:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-010]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 012-monetization

  story-006:
    if: inputs.expected_sha == ''
    needs: e2e-build
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 006-safe-zip-import

  story-001:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-006]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 001-ios-launch

  story-002:
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-001]
    uses: ./.github/workflows/ios-e2e-story.yml
    with:
      story: 002-import-and-play

  core-tests:
    name: Core tests and fixture gates
    if: ${{ !cancelled() && inputs.expected_sha == '' && needs.e2e-build.result == 'success' }}
    needs: [e2e-build, story-011]
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-shared-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/ios/DerivedData/NormalCI/SharedBuildArtifact
      - name: Verify source and immutable shared build
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          (cd apps/ios/DerivedData/NormalCI/SharedBuildArtifact \
            && shasum -a 256 -c SharedBuild.tar.sha256)
          mkdir -p apps/ios/DerivedData/NormalCI/SharedBuild
          tar -C apps/ios/DerivedData/NormalCI/SharedBuild -xf \
            apps/ios/DerivedData/NormalCI/SharedBuildArtifact/SharedBuild.tar
          portable_tools="${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild/PortableTools"
          export PATH="${portable_tools}:${PATH}"
          printf '%s\n' "${portable_tools}" >> "${GITHUB_PATH}"
          apps/ios/scripts/verify-e2e-environment.sh
          git diff --exit-code -- apps/ios/Player.xcodeproj
          apps/ios/scripts/e2e-build-provenance.sh verify \
            "${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5
      - name: Verify generated fixtures
        run: |
          mkdir -p apps/ios/DerivedData/NormalCI/Core/Logs
          apps/ios/scripts/fixtures/verify-generated-fixtures.sh \
            2>&1 | tee apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
          apps/ios/scripts/fixtures/verify-messy-multifile-fixture.sh \
            2>&1 | tee -a apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
          apps/ios/scripts/fixtures/verify-zip-fixtures.sh \
            2>&1 | tee -a apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
          apps/ios/scripts/fixtures/verify-import-channel-fixtures.sh \
            2>&1 | tee -a apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
          apps/ios/scripts/fixtures/verify-metadata-repair-fixture.sh \
            2>&1 | tee -a apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
          apps/ios/scripts/fixtures/verify-populated-library-fixture.sh \
            2>&1 | tee -a apps/ios/DerivedData/NormalCI/Core/Logs/fixtures.log
      - name: Run all core tests on a fresh host
        run: |
          core_root="${PWD}/apps/ios/DerivedData/NormalCI/Core"
          lease="${PWD}/apps/ios/DerivedData/SimulatorLeases/normal-ci-core-$$.json"
          simulator_id=""
          cleanup() {
            status="$?"
            trap - EXIT INT TERM
            if [[ -n "${simulator_id}" ]]; then
              apps/ios/scripts/simulator-lease.sh release "${lease}" "$$" || status=1
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          simulator_id="$(apps/ios/scripts/simulator-lease.sh acquire \
            "${lease}" 'Player normal CI core' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-26-5 "$$")"
          xcrun simctl boot "${simulator_id}"
          xcrun simctl bootstatus "${simulator_id}" -b
          xcodebuild test-without-building \
            -project apps/ios/Player.xcodeproj \
            -scheme Player \
            -configuration E2E \
            -destination "platform=iOS Simulator,arch=arm64,id=${simulator_id}" \
            -derivedDataPath "${PWD}/apps/ios/DerivedData/NormalCI/SharedBuild" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -only-testing:PlayerTests \
            -resultBundlePath "${core_root}/Core.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "${core_root}/Logs/core-tests.log"
          apps/ios/scripts/simulator-lease.sh release "${lease}" "$$"
          simulator_id=""
      - name: Upload complete core-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-tests
          path: apps/ios/DerivedData/NormalCI/Core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  ios-tests:
    name: Core tests and exact E2E walkthroughs
    if: ${{ always() && inputs.expected_sha == '' }}
    needs:
      - e2e-build
      - story-001
      - story-002
      - story-003
      - story-004
      - story-005
      - story-006
      - story-007
      - story-008
      - story-009
      - story-010
      - story-011
      - story-012
      - story-013
      - core-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel iOS gate
        env:
          IOS_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "${IOS_RESULTS}"

  r0-qualification:
    name: Formal exact-SHA R0 qualification
    if: inputs.expected_sha != ''
    uses: ./.github/workflows/r0-qualification.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
