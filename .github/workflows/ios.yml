name: iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - APP_STORE_LISTING.md
      - APP_STORE_LISTING_DESIGN.md
      - app-store/**
      - scripts/app-store-listing
      - scripts/capture-marketing-screenshots
      - scripts/render-app-store-listing.swift
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - APP_STORE_LISTING.md
      - APP_STORE_LISTING_DESIGN.md
      - app-store/**
      - scripts/app-store-listing
      - scripts/capture-marketing-screenshots
      - scripts/render-app-store-listing.swift
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock

permissions:
  contents: read

jobs:
  e2e-shards:
    name: iOS shard ${{ matrix.shard }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lane-1
            story_1: 007-sleep-timer
            story_2: 006-safe-zip-import
            story_3: ''
            run_core: false
            renders_listing: false
          - shard: lane-2
            story_1: 005-play-and-restore
            story_2: 009-accessible-core-journeys
            story_3: ''
            run_core: false
            renders_listing: false
          - shard: lane-3
            story_1: 008-library-search
            story_2: 002-import-and-play
            story_3: 012-monetization
            run_core: false
            renders_listing: false
          - shard: lane-4
            story_1: 013-app-store-listing
            story_2: 001-ios-launch
            story_3: 003-multifile-grouping
            run_core: false
            renders_listing: true
          - shard: lane-5
            story_1: 010-library-backup
            story_2: 011-offline-recovery
            story_3: 004-metadata-repair
            run_core: true
            renders_listing: false
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"
      PLAYER_SKIP_PROJECT_GENERATION: "1"
      PLAYER_E2E_PARALLEL_WORKERS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify pinned environment
        run: apps/ios/scripts/verify-e2e-environment.sh

      - name: Enforce deterministic E2E hygiene
        if: matrix.run_core
        run: apps/ios/scripts/verify-e2e-hygiene.sh

      - name: Generate Xcode project
        run: apps/ios/scripts/generate-project.sh

      - name: Require reproducible project generation
        run: git diff --exit-code -- apps/ios/Player.xcodeproj

      - name: Run canonical stories with one shared build
        env:
          SHARD: ${{ matrix.shard }}
          RUN_CORE: ${{ matrix.run_core }}
          STORY_1: ${{ matrix.story_1 }}
          STORY_2: ${{ matrix.story_2 }}
          STORY_3: ${{ matrix.story_3 }}
        run: |
          arguments=(--shard "${SHARD}")
          if [[ "${RUN_CORE}" == "true" ]]; then arguments+=(--core); fi
          for story in "${STORY_1}" "${STORY_2}" "${STORY_3}"; do
            if [[ -n "${story}" ]]; then arguments+=("${story}"); fi
          done
          apps/ios/scripts/run-e2e-shard.sh "${arguments[@]}"

      - name: Render reviewable App Store images
        if: matrix.renders_listing
        run: >-
          swift scripts/render-app-store-listing.swift
          app-store/listing.json
          apps/ios/DerivedData/E2E/013-app-store-listing/ActualWalkthrough/screenshots/ios
          build/app-store-listing/screenshots

      - name: Upload first story diagnostics
        if: ${{ always() && matrix.story_1 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ matrix.story_1 }}
          path: |
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/Run.json
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/PhaseTimings.tsv
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/Logs/
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/Diagnostics/
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/ActualWalkthrough/
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/Attachments/
            apps/ios/DerivedData/E2E/${{ matrix.story_1 }}/Results/Story.xcresult/
            build/app-store-listing/screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload second story diagnostics
        if: ${{ always() && matrix.story_2 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ matrix.story_2 }}
          path: |
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/Run.json
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/PhaseTimings.tsv
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/Logs/
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/Diagnostics/
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/ActualWalkthrough/
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/Attachments/
            apps/ios/DerivedData/E2E/${{ matrix.story_2 }}/Results/Story.xcresult/
          if-no-files-found: error
          retention-days: 14

      - name: Upload third story diagnostics
        if: ${{ always() && matrix.story_3 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ matrix.story_3 }}
          path: |
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/Run.json
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/PhaseTimings.tsv
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/Logs/
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/Diagnostics/
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/ActualWalkthrough/
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/Attachments/
            apps/ios/DerivedData/E2E/${{ matrix.story_3 }}/Results/Story.xcresult/
          if-no-files-found: error
          retention-days: 14

      - name: Upload shard and core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ matrix.shard }}-summary
          path: |
            apps/ios/DerivedData/E2EShards/${{ matrix.shard }}/Shard.json
            apps/ios/DerivedData/E2EShards/${{ matrix.shard }}/StoryTimings.tsv
            apps/ios/DerivedData/E2EShards/${{ matrix.shard }}/Logs/
            apps/ios/DerivedData/E2EShards/${{ matrix.shard }}/Core/
          if-no-files-found: error
          retention-days: 14

  ios-tests:
    name: Core tests and exact E2E walkthroughs
    if: always()
    needs: [e2e-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel iOS gate
        env:
          SHARD_RESULT: ${{ needs.e2e-shards.result }}
        run: test "$SHARD_RESULT" = success
