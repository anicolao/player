name: iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - tests/e2e/**
      - E2E_GUIDE.md
      - MVP_COMPLETION_PLAN.md
      - IMPLEMENTATION_PLAN.md
      - MVP_DESIGN.md
      - DIRECT_IMPORT_ALTERNATIVES.md
      - DIRECT_IMPORT_UX.md
      - BACKUP_AND_RESTORE.md
      - OFFLINE_RECOVERY_AUDIT.md
      - MVP_ACCEPTANCE_MATRIX.md
      - MONETIZATION_PLAN.md
      - APP_STORE_SUBMISSION_PLAN.md
      - MOCKUP_COMPARISON.md
      - README.md
      - TESTFLIGHT_SETUP.md
      - UX_DESIGN.md
      - VISION.md
      - .github/workflows/ios.yml
      - flake.nix
      - flake.lock

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify pinned environment
        run: apps/ios/scripts/verify-e2e-environment.sh

      - name: Generate Xcode project
        run: apps/ios/scripts/generate-project.sh

      - name: Require reproducible project generation
        run: git diff --exit-code -- apps/ios/Player.xcodeproj

      - name: Verify committed synthetic audio fixtures
        run: |
          apps/ios/scripts/fixtures/verify-generated-fixtures.sh
          apps/ios/scripts/fixtures/verify-messy-multifile-fixture.sh
          apps/ios/scripts/fixtures/verify-zip-fixtures.sh
          apps/ios/scripts/fixtures/verify-import-channel-fixtures.sh
          apps/ios/scripts/fixtures/verify-metadata-repair-fixture.sh
          apps/ios/scripts/fixtures/verify-populated-library-fixture.sh

      - name: Run import, storage, persistence, and playback tests
        run: |
          xcodebuild -quiet \
            -project apps/ios/Player.xcodeproj \
            -scheme Player \
            -configuration E2E \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:PlayerTests \
            test \
            CODE_SIGNING_ALLOWED=NO

  e2e:
    name: E2E ${{ matrix.story }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - story: 001-ios-launch
            tests: >-
              PlayerUITests/LaunchUITests/testLaunchesIntoEmptyLibrary
          - story: 002-import-and-play
            tests: >-
              PlayerUITests/ImportPlaybackUITests/testAbandonsReadyImportAndClearsInbox
              PlayerUITests/ImportPlaybackUITests/testReviewsCommitsAndPlaysOneAudiobook
              PlayerUITests/MetadataChapterUITests/testShowsEmbeddedMetadataAndStartsAChapter
              PlayerUITests/ImportIngressResilienceUITests/testDocumentOpenResumesOneImportAcrossAcquireAndInspectRestarts
              PlayerUITests/ImportIngressResilienceUITests/testConsumesAndDeduplicatesShareExtensionAppGroupHandoff
          - story: 003-multifile-grouping
            tests: >-
              PlayerUITests/MultifileGroupingUITests/testRepairsMessyMultifileGroupingAndCommitsOneBookAtomically
          - story: 004-metadata-repair
            tests: >-
              PlayerUITests/MetadataRepairUITests/testRepairsLocksCommitsAndUndoesMetadataWithoutChangingAudio
          - story: 005-play-and-restore
            tests: >-
              PlayerUITests/PositionRestoreUITests/testRestoresAnAcknowledgedPausedPositionAfterTermination
              PlayerUITests/RemoteInterruptionUITests/testRemoteInterruptionAndBackgroundEventsJournalAcknowledgedPositions
              PlayerUITests/TransportControlsUITests/testCustomizesAndRestoresListeningControls
              PlayerUITests/SmartRewindUITests/testSmartRewindAdaptsClampsPersistsAndUndoesExactly
              PlayerUITests/SmartRewindUITests/testSmartRewindNoticeDismissesAfterFiveSecondsOfPlaybackProgress
          - story: 006-safe-zip-import
            tests: >-
              PlayerUITests/SafeZIPImportUITests/testRejectsHostileZIPsThenCancelsAndRetriesAValidArchive
              PlayerUITests/ImportRecoveryStorageUITests/testRecoversMixedImportsAndExplainsStorageWithoutTouchingSources
          - story: 007-sleep-timer
            tests: >-
              PlayerUITests/SleepTimerUITests/testSleepTimerPersistsFadesStopsAndResumesWithContextExactly
              PlayerUITests/BookmarkUITests/testBookmarksCaptureOrganizeSearchJumpDeleteAndUndoExactly
          - story: 008-library-search
            tests: >-
              PlayerUITests/LibraryOrganizationUITests/testOrganizesDailyLibraryAndRestoresATrashedBook
          - story: 009-accessible-core-journeys
            tests: >-
              PlayerUITests/AccessibilityUITests/testCoreJourneysRemainCompleteAtLargestAccessibilityText
          - story: 010-library-backup
            tests: >-
              PlayerUITests/BackupUITests/testExportsClearsAndRestoresAVerifiedPortableLibrary
          - story: 011-offline-recovery
            tests: >-
              PlayerUITests/OfflineRecoveryUITests/testRecoversStartupAndExportsOnlySanitizedOfflineDiagnostics
          - story: 012-monetization
            tests: >-
              PlayerUITests/MonetizationUITests/testExplainsExhaustionAndCompletesAOneTimeUnlock
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -e -o pipefail {0}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PLAYER_SKIP_SIMULATOR_LAUNCH: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify pinned environment
        run: apps/ios/scripts/verify-e2e-environment.sh

      - name: Generate Xcode project
        run: apps/ios/scripts/generate-project.sh

      - name: Require reproducible project generation
        run: git diff --exit-code -- apps/ios/Player.xcodeproj

      - name: Run canonical-pixel story
        run: >-
          apps/ios/scripts/run-e2e.sh
          ${{ matrix.story }}
          ${{ matrix.tests }}

      - name: Upload reviewable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-${{ matrix.story }}
          path: |
            apps/ios/DerivedData/E2E/${{ matrix.story }}/ActualWalkthrough/
            apps/ios/DerivedData/E2E/${{ matrix.story }}/Attachments/
            apps/ios/DerivedData/E2E/${{ matrix.story }}/Results/Story.xcresult/
          if-no-files-found: warn
          retention-days: 7

  ios-tests:
    name: Core tests and exact E2E walkthroughs
    if: always()
    needs: [core-tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel iOS gate
        env:
          CORE_RESULT: ${{ needs.core-tests.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$CORE_RESULT" = success && test "$E2E_RESULT" = success
